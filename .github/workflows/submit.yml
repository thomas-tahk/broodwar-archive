name: submit

# A maintainer labels a submission issue `accepted-submission` (only people with
# triage access can label, so strangers cannot start this). The issue form is turned
# into a catalog file, validated, and opened as a pull request that closes the issue.
# The result of the validator is posted back on the issue. The owner merges the PR.
#
# The issue body is untrusted text: it only ever reaches the job through an env
# variable and is read by tools/submit (never interpolated into a shell command).
# No `${{ }}` appears inside any run: block.
# Needs repo setting: Settings -> Actions -> General -> "Allow GitHub Actions to
# create and approve pull requests".

on:
  issues:
    types: [labeled]

concurrency:
  group: submit-${{ github.event.issue.number }}
  cancel-in-progress: false

permissions:
  contents: write
  pull-requests: write
  issues: write
  actions: write

jobs:
  submit:
    if: github.event.label.name == 'accepted-submission'
    runs-on: ubuntu-latest
    env:
      ISSUE_NUMBER: ${{ github.event.issue.number }}
      ISSUE_BODY: ${{ github.event.issue.body }}
      DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
    steps:
      # actions/checkout v5
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09
        with:
          persist-credentials: false
      # actions/setup-node v5
      - uses: actions/setup-node@a0853c24544627f65ddf259abe73b1d18a591444
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci --ignore-scripts
      - id: submit
        name: Turn the issue form into a catalog file and validate it
        run: RESULT_FILE="$RUNNER_TEMP/final-comment.md" node tools/submit/run.js
      - id: pr
        name: Open or update the pull request
        if: steps.submit.outputs.status == 'ok'
        env:
          GH_TOKEN: ${{ github.token }}
          BRANCH_FILE: ${{ steps.submit.outputs.file }}
          SUBMISSION_KIND: ${{ steps.submit.outputs.kind }}
        run: |
          branch="submission/issue-$ISSUE_NUMBER"
          bot_email="41898282+github-actions[bot]@users.noreply.github.com"
          comment="$RUNNER_TEMP/final-comment.md"
          existing="$(gh pr list --head "$branch" --state open --json number --jq '.[0].number // empty')"
          if [ -n "$existing" ]; then
            foreign="$(gh api "repos/$GITHUB_REPOSITORY/pulls/$existing/commits" --paginate \
              --jq ".[] | select(.commit.author.email != \"$bot_email\") | .sha")"
            if [ -n "$foreign" ]; then
              printf 'Pull request #%s already has commits that were not made by the bot, so I left it alone. Nothing was overwritten. A maintainer can close that PR and re-apply the label to start fresh.\n' "$existing" > "$comment"
              exit 0
            fi
          fi
          git config user.name "github-actions[bot]"
          git config user.email "$bot_email"
          git switch -C "$branch"
          git add -- "$BRANCH_FILE"
          git commit -m "Submission ($SUBMISSION_KIND) from issue #$ISSUE_NUMBER"
          git push --force "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "$branch"
          printf 'Closes #%s\n\nGenerated from the issue form. The validator passed. Please review the file before merging.\n\nCI was dispatched on this branch by the submit workflow, because pull requests opened with the default token do not start CI on their own.\n' "$ISSUE_NUMBER" > "$RUNNER_TEMP/pr-body.md"
          if [ -z "$existing" ]; then
            pr_url="$(gh pr create --base "$DEFAULT_BRANCH" --head "$branch" \
              --title "Submission ($SUBMISSION_KIND) from issue #$ISSUE_NUMBER" \
              --body-file "$RUNNER_TEMP/pr-body.md")"
          else
            pr_url="$(gh pr view "$existing" --json url --jq .url)"
          fi
          gh workflow run ci.yml --ref "$branch"
          printf 'Validator passed for `%s`. Pull request: %s\n' "$BRANCH_FILE" "$pr_url" > "$comment"
      - name: Comment the result on the issue
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
          SUBMIT_STATUS: ${{ steps.submit.outputs.status }}
          PR_OUTCOME: ${{ steps.pr.outcome }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          comment="$RUNNER_TEMP/final-comment.md"
          if [ "$SUBMIT_STATUS" = "ok" ] && [ "$PR_OUTCOME" != "success" ]; then
            printf 'The file was valid but opening the pull request failed. See the run log: %s\n' "$RUN_URL" > "$comment"
          elif [ -z "$SUBMIT_STATUS" ]; then
            printf 'Internal error while processing this submission. See the run log: %s\n' "$RUN_URL" > "$comment"
          fi
          gh issue comment "$ISSUE_NUMBER" --body-file "$comment"
