name: Wrong info
description: Something in the catalog or on the site is wrong.
labels: ["wrong-info"]
body:
  - type: input
    id: where
    attributes:
      label: Match or page
      description: Which match or page is wrong? A link is best.
    validations:
      required: true
  - type: textarea
    id: wrong
    attributes:
      label: What's wrong
    validations:
      required: true
  - type: input
    id: correct
    attributes:
      label: Correct value
    validations:
      required: true
  - type: input
    id: source
    attributes:
      label: Source link
      description: Where we can check the correct value. Every fact needs a source.
    validations:
      required: true
